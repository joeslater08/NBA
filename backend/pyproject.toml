[project]
name = "nba-intelligence-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "alembic", "pydantic", "tzdata"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 100
